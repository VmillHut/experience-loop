interface:
  display_name: "Experience Loop"
  short_description: "Net-value engineering growth with explicit focus and deep modes"
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.svg"
  default_prompt: "Use $experience-loop with task quality first. Honor an explicitly saved mode; otherwise use auto and choose silence, embedded guidance, or at most two skippable checkpoints by expected net user value. Take the fast path for mechanical, urgent, or delivery-only work, honor off with no learning tail, and never infer focus or deep from complexity."

policy:
  allow_implicit_invocation: true
