interface:
  display_name: "Experience Loop"
  short_description: "Adaptive engineering growth without lowering task quality"
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.svg"
  default_prompt: "Use $experience-loop as a thin, adaptive learning sidecar for substantive software work. Resolve the task-scoped or saved mode from evidence without turning it into a fixed workflow. Preserve and prefer the host Agent's stronger planning, reasoning, tools, engineering coverage, and verification. Honor explicit off and delivery-only requests."

policy:
  allow_implicit_invocation: false
