name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Release contract
        run: python -B scripts/verify_release.py --skip-tests
      - name: Tag and version contract
        if: startsWith(github.ref, 'refs/tags/')
        run: python -B scripts/verify_release.py --skip-tests --expected-tag "${{ github.ref_name }}"
      - name: Unit and integration tests
        run: python -B -m unittest discover -s tests -v
      - name: Skill CLI smoke test
        run: python -B scripts/experience_loop.py --help
      - name: Installer dry run
        run: python -B scripts/install.py --dry-run --json
