<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Experience Loop</title>
  <desc id="desc">An abstract visual of delivery, evidence, and human judgment becoming a continuous loop.</desc>
  <defs>
    <linearGradient id="surface" x1="80" y1="22" x2="1510" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.48" stop-color="#101A32"/>
      <stop offset="1" stop-color="#0A1528"/>
    </linearGradient>
    <radialGradient id="haloA" cx="0" cy="0" r="1" gradientTransform="translate(1144 280) rotate(90) scale(294 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity=".28"/>
      <stop offset=".54" stop-color="#2F79F7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0" cy="0" r="1" gradientTransform="translate(434 430) rotate(72) scale(248 394)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6574FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6574FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="618" y1="145" x2="1298" y2="499" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24D0B9"/>
      <stop offset=".5" stop-color="#56B7FF"/>
      <stop offset="1" stop-color="#7A6CFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".035"/>
    </linearGradient>
    <linearGradient id="orb" x1="1022" y1="186" x2="1234" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset=".52" stop-color="#438BFF"/>
      <stop offset="1" stop-color="#7568FF"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".42"/></filter>
    <filter id="orbGlow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#51C5FF" flood-opacity=".45"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9CB7E0" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1 1L12 7L1 13" fill="none" stroke="#7CDBD0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

