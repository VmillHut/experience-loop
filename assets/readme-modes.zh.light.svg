<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Experience Loop 四种模式</title>
  <desc id="desc">auto 根据证据智能决定，focus 围绕一个目标定向练习，deep 完整推演，off 只交付并关闭学习层。</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" text-anchor="middle">
    <rect x="18" y="20" width="276" height="170" rx="18" fill="#F0FDFA" stroke="#5EEAD4"/>
    <path d="M46 20H266" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
    <text x="156" y="66" fill="#0F766E" font-size="26" font-weight="750">auto</text>
    <text x="156" y="94" fill="#0F766E" font-size="14" font-weight="650" letter-spacing="1.5">默认智能</text>
    <text x="156" y="137" fill="#334155" font-size="18" font-weight="600">随任务证据决定</text>
    <text x="156" y="164" fill="#64748B" font-size="16">静默或介入</text>

    <rect x="312" y="20" width="276" height="170" rx="18" fill="#EFF6FF" stroke="#93C5FD"/>
    <path d="M340 20H560" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <text x="450" y="66" fill="#2563EB" font-size="26" font-weight="750">focus</text>
    <text x="450" y="94" fill="#2563EB" font-size="14" font-weight="650" letter-spacing="1.5">定向练习</text>
    <text x="450" y="137" fill="#334155" font-size="18" font-weight="600">围绕一个目标</text>
    <text x="450" y="164" fill="#64748B" font-size="16">短而有边界</text>

    <rect x="606" y="20" width="276" height="170" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/>
    <path d="M634 20H854" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
    <text x="744" y="66" fill="#4F46E5" font-size="26" font-weight="750">deep</text>
    <text x="744" y="94" fill="#4F46E5" font-size="14" font-weight="650" letter-spacing="1.5">完整推演</text>
    <text x="744" y="137" fill="#334155" font-size="18" font-weight="600">建模、取舍、验证</text>
    <text x="744" y="164" fill="#64748B" font-size="16">由你显式开启</text>

    <rect x="900" y="20" width="276" height="170" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M928 20H1148" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <text x="1038" y="66" fill="#475569" font-size="26" font-weight="750">off</text>
    <text x="1038" y="94" fill="#64748B" font-size="14" font-weight="650" letter-spacing="1.5">只交付</text>
    <text x="1038" y="137" fill="#334155" font-size="18" font-weight="600">关闭学习层</text>
    <text x="1038" y="164" fill="#64748B" font-size="16">原生能力不变</text>
  </g>
</svg>
