<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 570" role="img" aria-labelledby="title desc"><title id="title">Experience Loop's evidence-driven intervention mechanism</title><desc id="desc">Experience Loop selects a response from task evidence, the value of a human judgment, and whether it is the right moment to intervene.</desc><defs><linearGradient id="surface" x1="46" y1="20" x2="1455" y2="554" gradientUnits="userSpaceOnUse"><stop stop-color="#0A1221"/><stop offset=".54" stop-color="#101A31"/><stop offset="1" stop-color="#0B1627"/></linearGradient><linearGradient id="accent" x1="180" y1="192" x2="1255" y2="403" gradientUnits="userSpaceOnUse"><stop stop-color="#25CEBA"/><stop offset=".52" stop-color="#4DA5FF"/><stop offset="1" stop-color="#746FFF"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFF" stop-opacity=".02"/></linearGradient><filter id="shadow" x="-30%" y="-50%" width="160%" height="210%"><feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/></filter><filter id="glow" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="15"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#72E7D9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1500" height="570" rx="34" fill="url(#surface)"/><text x="58" y="63" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Core mechanism: use evidence to decide when to intervene.</text><text x="58" y="90" fill="#8290A7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8">DETECT FIRST · THEN CHOOSE THE RESPONSE WITH THE HIGHEST EXPECTED VALUE</text><path d="M58 118H1442" stroke="#9CB3D0" stroke-opacity=".13"/><path d="M261 285H1254" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" opacity=".18" filter="url(#glow)"/><path d="M261 285H1254" fill="none" stroke="url(#accent)" stroke-width="3.4" stroke-linecap="round"/><g fill="none" stroke="#72E7D9" stroke-width="3" marker-end="url(#arrow)"><path d="M448 285h66"/><path d="M786 285h66"/><path d="M1124 285h66"/></g><g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)"><g><rect x="82" y="184" width="366" height="202" rx="27" fill="#10313A" stroke="#2D938B"/><rect x="82.5" y="184.5" width="365" height="201" rx="26.5" fill="url(#glass)"/><circle cx="130" cy="231" r="24" fill="#174A50" stroke="#4AD0C1"/><text x="130" y="237" text-anchor="middle" fill="#C9FFF7" font-size="19" font-weight="800">1</text><text x="168" y="229" fill="#F0FFFC" font-size="21" font-weight="700">Read task evidence</text><text x="168" y="255" fill="#8EE4D8" font-size="13" font-weight="650">Which risks are actually activated?</text><path d="M112 300H411" stroke="#86B9B8" stroke-opacity=".18"/><text x="112" y="331" fill="#CDE4E1" font-size="15">Boundary · coupling · recovery</text><text x="112" y="356" fill="#7BA9A5" font-size="13">Use the evidence this task really needs.</text></g><g><rect x="520" y="184" width="366" height="202" rx="27" fill="#112E40" stroke="#377FA0"/><rect x="520.5" y="184.5" width="365" height="201" rx="26.5" fill="url(#glass)"/><circle cx="568" cy="231" r="24" fill="#184257" stroke="#58AEE0"/><text x="568" y="237" text-anchor="middle" fill="#D4F0FF" font-size="19" font-weight="800">2</text><text x="606" y="229" fill="#F1FBFF" font-size="21" font-weight="700">Keep a human judgment</text><text x="606" y="255" fill="#A4DAFB" font-size="13" font-weight="650">Is it valuable and later verifiable?</text><path d="M550 300H849" stroke="#94BAD4" stroke-opacity=".18"/><text x="550" y="331" fill="#D7E9F4" font-size="15">Not a fact a tool can simply look up.</text><text x="550" y="356" fill="#89ACC4" font-size="13">Never ask a decorative question.</text></g><g><rect x="958" y="184" width="366" height="202" rx="27" fill="#1A294A" stroke="#6170BD"/><rect x="958.5" y="184.5" width="365" height="201" rx="26.5" fill="url(#glass)"/><circle cx="1006" cy="231" r="24" fill="#29325F" stroke="#7D8BE4"/><text x="1006" y="237" text-anchor="middle" fill="#E4E6FF" font-size="19" font-weight="800">3</text><text x="1044" y="229" fill="#F7F8FF" font-size="21" font-weight="700">Check the moment</text><text x="1044" y="255" fill="#C0C6FF" font-size="13" font-weight="650">Would waiting lower delivery or safety?</text><path d="M988 300H1287" stroke="#B7BCEF" stroke-opacity=".18"/><text x="988" y="331" fill="#E4E5FA" font-size="15">Is there pressure? Can this wait?</text><text x="988" y="356" fill="#A8AEDB" font-size="13">Do not interrupt delivery for learning.</text></g></g><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="58" y="447" fill="#AEBFD2" font-size="14" font-weight="700" letter-spacing="1.3">THEN SELECT THE RIGHT LEVEL OF RESPONSE</text><g filter="url(#shadow)"><rect x="58" y="467" width="224" height="56" rx="18" fill="#172537" stroke="#384B62"/><text x="170" y="501" text-anchor="middle" fill="#C7D5E4" font-size="16" font-weight="700">Stay quiet</text><rect x="304" y="467" width="224" height="56" rx="18" fill="#14343E" stroke="#31978D"/><text x="416" y="501" text-anchor="middle" fill="#9FF0E3" font-size="16" font-weight="700">Explain inline</text><rect x="550" y="467" width="224" height="56" rx="18" fill="#153246" stroke="#3C7FA1"/><text x="662" y="501" text-anchor="middle" fill="#A9DCF8" font-size="16" font-weight="700">Optional checkpoint</text><rect x="796" y="467" width="224" height="56" rx="18" fill="#202A50" stroke="#6775C3"/><text x="908" y="501" text-anchor="middle" fill="#CED3FF" font-size="16" font-weight="700">Required judgment</text><rect x="1042" y="467" width="400" height="56" rx="18" fill="url(#accent)"/><text x="1242" y="501" text-anchor="middle" fill="#FFF" font-size="16" font-weight="800">Short practice loop</text></g></g><rect x="1" y="1" width="1498" height="568" rx="33" fill="none" stroke="#A8C4E8" stroke-opacity=".12" stroke-width="2"/></svg>
